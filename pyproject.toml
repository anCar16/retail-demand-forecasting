[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "16-day sales forecasting for 1,782 store-family series (Corporación Favorita) with time-based backtesting and a global LightGBM model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyterlab>=4.6.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]
